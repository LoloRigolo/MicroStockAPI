<div class="container mx-auto p-6">
  <h1 class="text-2xl font-bold mb-4">Dashboard Admin</h1>

  <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
    {{ error }}
  </div>
  <div *ngIf="success" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
    {{ success }}
  </div>

  <form (submit)="createUser(); $event.preventDefault()">
    <label>Nom d'utilisateur</label>
    <input [(ngModel)]="newUser.email" name="email" class="border border-gray-300 rounded px-3 py-2 w-full mb-3" required />

    <label>Mot de passe</label>
    <input [(ngModel)]="newUser.password" name="password" type="password" class="border border-gray-300 rounded px-3 py-2 w-full mb-3" required />

    <label>Rôle</label>
    <select [(ngModel)]="newUser.role" name="role" class="border border-gray-300 rounded px-3 py-2 w-full mb-3">
      <option value="User">User</option>
      <option value="Admin">Admin</option>
      <option value="Magasin">Magasin</option>
    </select>

    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
      Créer utilisateur
    </button>
  </form>

  <h2 class="text-xl font-semibold mt-10 mb-4">📦 Liste des Stockages</h2>

  <table *ngIf="stockages.length > 0" class="min-w-full bg-white border rounded shadow">
    <thead class="bg-gray-200">
      <tr>
        <th class="px-4 py-2 border">ID Magasin</th>
        <th class="px-4 py-2 border">ID Marchandise</th>
        <th class="px-4 py-2 border">Volume</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let s of stockages">
        <td class="px-4 py-2 border">{{ s.id_magasin }}</td>
        <td class="px-4 py-2 border">{{ s.id_marchandise }}</td>
        <td class="px-4 py-2 border">{{ s.volume }}</td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="stockages.length === 0" class="text-gray-500 mt-4">Aucun stockage trouvé.</p>
</div>
