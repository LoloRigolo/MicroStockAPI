<div class="container mx-auto p-4">
  <h1 class="text-2xl font-bold mb-4">Liste des marchandises</h1>

  <div *ngIf="error" class="text-red-600 mb-6">
    {{ error }}
  </div>

  <table class="min-w-full bg-white">
    <thead>
      <tr>
        <th class="px-4 py-2 border">Nom</th>
        <th class="px-4 py-2 border">Prix</th>
        <th class="px-4 py-2 border">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let m of marchandises">
        <td class="px-4 py-2 border">{{ m.nom }}</td>
        <td class="px-4 py-2 border">{{ m.prix | currency: 'EUR' }}</td>
        <td class="px-4 py-2 border">
          <button
            (click)="addToPanier(m)"
            class="bg-blue-600 text-white px-2 py-1 rounded"
          >
            Ajouter au panier
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <form (submit)="addProduit(); $event.preventDefault()" class="mt-6">
    <input
      type="text"
      placeholder="Nom"
      [(ngModel)]="newProduit.nom"
      name="nom"
      class="border px-2 py-1 mr-2"
      required
    />
    <input
      type="number"
      placeholder="Prix"
      [(ngModel)]="newProduit.prix"
      name="prix"
      class="border px-2 py-1 mr-2"
      required
    />
    <button
      type="submit"
      class="bg-green-600 text-white px-4 py-2 rounded"
    >
      Ajouter
    </button>
  </form>

  <button
    (click)="onLogout()"
    class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 mt-6"
  >
    Logout
  </button>
</div>
