<!-- login.component.html -->
<div class="min-h-screen flex">
  <!-- Logo à gauche sur fond Night -->
  <div class="hidden md:flex w-1/2 bg-[#090B0C] items-center justify-center">
    <img
      src="assets/logo.png"
      alt="MicroStockApi Logo"
      class="w-64 object-contain"
    />
  </div>

  <!-- Formulaire à droite sur fond Anti-flash White -->
  <div
    class="flex flex-col w-full md:w-1/2 bg-[#F1F4F6] items-center justify-center p-8"
  >
    <div class="w-full max-w-sm border-2 border-[#0077B6] rounded-lg p-8">
      <h2 class="text-3xl font-semibold text-[#090B0C] mb-6 text-center">
        Se connecter
      </h2>

      <form
        (ngSubmit)="onSubmit(); $event.preventDefault()"
        class="space-y-6"
      >
        <!-- Nom d’utilisateur -->
        <div>
          <label for="username" class="block text-[#090B0C] mb-1">
            Nom d’utilisateur
          </label>
          <input
            id="username"
            name="username"
            [(ngModel)]="email"
            type="text"
            required
            placeholder="Votre nom d’utilisateur"
            class="w-full px-4 py-2 bg-[#F1F4F6] border-2 border-[#0077B6]
                   rounded-lg text-[#090B0C] placeholder-[#0077B6]
                   focus:outline-none focus:ring-2 focus:ring-[#0077B6]"
          />
        </div>

        <!-- Mot de passe -->
        <div>
          <label for="password" class="block text-[#090B0C] mb-1">
            Mot de passe
          </label>
          <input
            id="password"
            name="password"
            [(ngModel)]="password"
            type="password"
            required
            placeholder="Votre mot de passe"
            class="w-full px-4 py-2 bg-[#F1F4F6] border-2 border-[#0077B6]
                   rounded-lg text-[#090B0C] placeholder-[#0077B6]
                   focus:outline-none focus:ring-2 focus:ring-[#0077B6]"
          />
        </div>

        <!-- Bouton Submit -->
        <button
          type="submit"
          class="w-full py-2 rounded-lg bg-[#0077B6] text-[#F1F4F6]
                 font-semibold hover:bg-[#090B0C] transition-colors"
        >
          Se connecter
        </button>

        <!-- Message d’erreur -->
        <div *ngIf="error" class="text-center text-[#090B0C]">
          {{ error }}
        </div>

        <!-- Lien register -->
        <p class="text-center text-[#090B0C]">
          Pas encore de compte ?
          <a routerLink="/register" class="text-[#0077B6] underline">
            Créer un compte
          </a>
        </p>
      </form>
    </div>
  </div>
</div>
