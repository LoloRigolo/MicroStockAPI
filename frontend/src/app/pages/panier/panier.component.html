<div class="container mx-auto p-6">
  <h1 class="text-2xl font-bold mb-6">🛒 Mon Panier</h1>

  <div *ngIf="error" class="text-red-600">{{ error }}</div>

  <div *ngIf="panierArticles.length === 0" class="text-gray-500">
    Ton panier est vide.
  </div>

  <table *ngIf="panierArticles.length > 0" class="min-w-full bg-white border rounded shadow">
    <thead class="bg-gray-200">
      <tr>
        <th class="px-4 py-2 border">Nom</th>
        <th class="px-4 py-2 border">Prix</th>
        <th class="px-4 py-2 border">Quantité</th>
        <th class="px-4 py-2 border">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let article of panierArticles">
        <td class="px-4 py-2 border">{{ article.nom }}</td>
        <td class="px-4 py-2 border">{{ article.prix | currency: 'EUR' }}</td>
        <td class="px-4 py-2 border">
          <div class="flex items-center justify-center space-x-2">
            <button
              (click)="decreaseQuantity(article)"
              class="bg-gray-300 text-gray-800 px-2 py-1 rounded hover:bg-gray-400"
            >
              −
            </button>
            <span class="text-gray-700 font-semibold">{{ article.quantite }}</span>
            <button
              (click)="increaseQuantity(article)"
              class="bg-green-500 text-white px-2 py-1 rounded hover:bg-green-600"
            >
              +
            </button>
          </div>
        </td>
        <td class="px-4 py-2 border text-center">
          <button
            (click)="removeArticle(article)"
            class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600"
          >
            Supprimer
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="panierArticles.length > 0" class="mt-6 flex justify-center space-x-4">
    <button
      (click)="emptyPanier()"
      class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700"
    >
      Vider le panier
    </button>

    <button
      (click)="validatePanier()"
      class="bg-green-600 text-white font-bold px-6 py-3 rounded hover:bg-green-700 transition"
    >
      Valider le panier
    </button>
  </div>

  <div class="flex justify-center mt-6">
    <button
      class="mt-6 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
      (click)="retourDashboard()"
    >
      Retour au dashboard
    </button>
  </div>
</div>
