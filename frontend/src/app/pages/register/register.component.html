<!-- register.component.html -->
<div class="min-h-screen flex items-center justify-center bg-[#F1F4F6] p-4">
  <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-6">
    <h2 class="text-2xl font-bold mb-6 text-center text-[#090B0C]">
      Créer un compte
    </h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Username -->
      <div>
        <label for="username" class="block text-[#090B0C] mb-1">
          Nom d’utilisateur
        </label>
        <input
          id="username"
          formControlName="username"
          type="text"
          placeholder="Votre nom d’utilisateur"
          class="w-full px-4 py-2 border border-[#090B0C] rounded-lg
                 focus:outline-none focus:ring-2 focus:ring-[#0077B6]"
        />
        <p
          *ngIf="registerForm.get('username')?.touched && registerForm.get('username')?.invalid"
          class="text-red-600 text-sm mt-1"
        >
          Le nom d’utilisateur est requis.
        </p>
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-[#090B0C] mb-1">
          Mot de passe
        </label>
        <input
          id="password"
          formControlName="password"
          type="password"
          placeholder="Votre mot de passe"
          class="w-full px-4 py-2 border border-[#090B0C] rounded-lg
                 focus:outline-none focus:ring-2 focus:ring-[#0077B6]"
        />
        <p
          *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid"
          class="text-red-600 text-sm mt-1"
        >
          Le mot de passe est requis.
        </p>
      </div>

      <!-- Bouton S’inscrire -->
      <button
        type="submit"
        [disabled]="registerForm.invalid"
        class="w-full bg-[#0077B6] hover:bg-[#090B0C] text-white font-semibold
               py-2 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed"
      >
        S’inscrire
      </button>

      <!-- Message d’erreur serveur -->
      <div *ngIf="errorMessage" class="mt-4 text-red-600 text-center">
        {{ errorMessage }}
      </div>
    </form>
  </div>
</div>
