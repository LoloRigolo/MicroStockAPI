<div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
  <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-6">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Créer un compte</h2>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <div class="mb-4">
        <label for="username" class="block text-gray-700 font-medium mb-1">Nom d’utilisateur</label>
        <input
          id="username"
          formControlName="username"
          type="text"
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="Entrez votre nom d’utilisateur"
        />
        <p *ngIf="registerForm.get('username')?.touched && registerForm.get('username')?.invalid"
           class="text-red-500 text-sm mt-1">
          Le nom d’utilisateur est requis.
        </p>
      </div>

      <div class="mb-6">
        <label for="password" class="block text-gray-700 font-medium mb-1">Mot de passe</label>
        <input
          id="password"
          formControlName="password"
          type="password"
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="Entrez votre mot de passe"
        />
        <p *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid"
           class="text-red-500 text-sm mt-1">
          Le mot de passe est requis.
        </p>
      </div>

      <button
        type="submit"
        [disabled]="registerForm.invalid"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed"
      >
        S’inscrire
      </button>

      <div *ngIf="errorMessage" class="mt-4 text-center text-red-600">
        {{ errorMessage }}
      </div>
    </form>
  </div>
</div>
