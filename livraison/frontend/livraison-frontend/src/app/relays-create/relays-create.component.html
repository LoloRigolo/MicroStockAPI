<form [formGroup]="createRelayForm" (ngSubmit)="onSubmit()" class="post-form">
    <h2>Créer un nouveau relay</h2>
    <div class="form-group">
        <label for="title">Nom</label>
        <input type="text" id="nom" formControlName="nom" required>
    </div>
    <div class="form-group">
        <label for="lat">Latitude</label>
        <input id="lat" formControlName="lat" required>
    </div>
    <div class="form-group">
        <label for="lng">Longitude</label>
        <input id="lng" formControlName="lng" required>
    </div>
    <button type="submit" [disabled]="createRelayForm.invalid">Publier</button>
</form>
